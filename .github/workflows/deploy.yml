name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily rebuild so the GitHub contribution graph in the hero stays current.
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the CV's "Updated" date is when src/data/cv.ts last changed
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Refresh the contribution graph. If GitHub's API is unavailable, the
      # committed snapshot in src/data/github.json is used instead.
      - run: npm run github
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
      # Print /cv to out/cv.pdf (fails if the CV runs past one A4 page).
      - run: npx playwright install --with-deps chromium
      - run: npm run cv
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
