name: CI

# Build check for pull requests into main, which Vercel deploys to production:
# a build-breaking change, or a CV that runs past one A4 page, shows red here
# before it can merge.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Built with the CV in it, which the public site leaves out (src/cv/flags.ts),
      # so the next step can print it.
      - run: npm run build
        env:
          CV_BUILD: '1'
      # Print the CV too: fails the check if it runs past one A4 page.
      - run: npx playwright install --with-deps chromium
      - run: node scripts/build-cv.mjs
      - run: npm run og
      - run: npm run readme
